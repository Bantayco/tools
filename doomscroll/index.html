<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Paper Doomscroll</title>
    <script>try{var t=localStorage.getItem('bantay-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <link rel="stylesheet" href="/_shared/tokens.css">
    <link rel="stylesheet" href="/_shared/tokens-extended.css">
    <link rel="stylesheet" href="/_shared/base.css">
    <link rel="stylesheet" href="/_shared/dark.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <!-- ============ SETUP: paste a paper ============ -->
    <main id="setup" class="setup">
      <header class="setup-head">
        <div>
          <h1>Paper Doomscroll 🧠📲</h1>
          <p class="status" id="status" aria-live="polite">
            Paste a paper. We chop it into bite-size cards you can mindlessly
            scroll — with a little dopamine on every flick.
          </p>
        </div>
      </header>

      <section class="setup-form">
        <div class="row">
          <input id="title" type="text" placeholder="paper title (optional)"
            autocomplete="off" aria-label="Paper title">
          <select id="myPapers" aria-label="My saved papers" title="My saved papers">
            <option value="">My papers…</option>
          </select>
        </div>

        <textarea id="source" class="source" spellcheck="false"
          aria-label="Paste the paper text here"
          placeholder="Paste the full text of a paper, abstract, blog post, anything…"></textarea>

        <div class="row actions">
          <button id="loadSample" type="button">Load sample</button>
          <span class="spacer"></span>
          <button id="start" type="button" class="primary">Start scrolling ↓</button>
        </div>
      </section>
    </main>

    <!-- ============ FEED: the doomscroll ============ -->
    <main id="feed" class="feed" hidden>
      <!-- Heads-up display -->
      <div class="hud">
        <button id="exit" class="hud-btn" type="button" title="Back to paste">✕</button>
        <div class="progress" aria-hidden="true"><div id="progressBar" class="progress-bar"></div></div>
        <div class="hud-stats">
          <span id="streak" class="chip streak" title="Scroll streak">🔥 0</span>
          <span id="level" class="chip level" title="Level">Lv 1</span>
          <button id="soundToggle" class="hud-btn" type="button" title="Sound on/off" aria-pressed="false">🔇</button>
        </div>
      </div>

      <!-- The scroll-snap card stack -->
      <div id="cards" class="cards" tabindex="0" aria-label="Paper feed"></div>

      <!-- Floating effect layers -->
      <div id="pops" class="pops" aria-hidden="true"></div>
      <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
