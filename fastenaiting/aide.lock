  invariant:
    inv_camera_always_stops:
      parent: invariants
      props:
        category: privacy
        done: true
        statement: >-
          Every MediaStream started by the app is fully stopped before the app releases the user (stop, reset, tab
          hidden, unload).
        threat_signal: OS camera indicator remains on after user leaves camera tab or unloads the page.
      sha256: 2e9cd13aab258c36bea8c4dfc3e0bf64bebab98c2803edd645ee1a3256baba15
    inv_gesture_gated_camera:
      parent: invariants
      props:
        category: privacy
        done: true
        statement: getUserMedia is only invoked as a direct result of a user gesture.
        threat_signal: getUserMedia call in a stack trace with no preceding pointer/keyboard event.
      sha256: 6d15a13ded31c9dec5e2832ee679d32bb19831df777ce8b9bd6c8bb3c4d7eff9
    inv_identify_response_validated:
      parent: invariants
      props:
        category: data_integrity
        done: true
        statement: >-
          Only whitelisted fastener fields from the identify response ever populate the form. Additional keys are
          ignored.
        threat_signal: A form field with a name not in the declared schema was written to by the identify response.
      sha256: 743ed0b6664486cc241e58d8266840dca9589516805974e0a524883ac01ff35d
    inv_json_only_from_model:
      parent: invariants
      props:
        category: data_integrity
        done: true
        statement: >-
          The identify endpoint returns valid JSON matching the fastener schema, or an error — never partially parsed
          prose.
        threat_signal: A 200 response body that fails JSON.parse or fails the field whitelist.
      sha256: a475b6fa638a5a104a15043a9ad3d079b3918738b77b9789dbc81cbf240b22b2
    inv_key_never_leaks:
      parent: invariants
      props:
        category: security
        done: true
        statement: >-
          A user-supplied API key is sent only in the x-user-api-key header of /api/fastenaiting/identify, and never
          appears in labels, downloads, filenames, URLs, storage other than localStorage, or console output.
        threat_signal: An API key value found anywhere other than the localStorage settings blob and the identify request header.
      sha256: a084b1af1a6b2b71e1e8604ae27169370f39622602e2b5487e77d83e4e420a06
    inv_label_aspect_matches_tape:
      parent: invariants
      props:
        category: export_fidelity
        done: true
        statement: 'The label canvas aspect ratio is exactly 12mm : selected-length-mm, within ±1 pixel.'
        threat_signal: A downloaded label's dimensions don't match the announced tape geometry.
      sha256: 4217f7c69431a2816ce0ce8b92c39814a55e71eda2adad04e2dc9862405ee6a4
    inv_label_deterministic:
      parent: invariants
      props:
        category: export_fidelity
        done: false
        statement: >-
          The label rendered for a given spec + label-style + label-length is byte-identical on any load (same fonts,
          same DPI, same layout math).
        threat_signal: Two consecutive downloads of an unchanged label produce different PNG hashes.
      sha256: 275ac3633343bde2923459e891058884c633c915835907daf700a5370b054d7b
    inv_no_content_overflow:
      parent: invariants
      props:
        category: export_fidelity
        done: true
        statement: All label text and the isometric fit inside the printable safe area — no clipping at the edges.
        threat_signal: Text truncation without an ellipsis, or isometric extending past its allocated icon rectangle.
      sha256: c6e5c18f20a1428e3d6e079fc614ec48938857e4c62cf8eeb46277f39b37386a
    inv_no_ios_zoom_on_focus:
      parent: invariants
      props:
        category: accessibility
        done: true
        statement: iOS Safari does not zoom the viewport when any input or select receives focus.
        threat_signal: A form field with computed font-size below 16px.
      sha256: c399a1ed9e72458d0bebf0ac95a98d18095c002338f388b09c6e8f5e32c7c65a
    inv_no_pii_persisted:
      parent: invariants
      props:
        category: privacy
        done: true
        statement: >-
          Server-side storage never contains user photos, API keys, IP addresses, or any field derived from user
          identity.
        threat_signal: Any server log or D1 row referencing user identity from a fastenaiting request.
      sha256: cf097217a9839116f9ac5b598f80d00185b6a8630cb4a26a821227b0f912da42
    inv_offline_functional:
      parent: invariants
      props:
        category: availability
        done: true
        statement: >-
          With no network, the app shell loads, manual entry works, the label renders, and Download PNG succeeds. Only
          Identify fails, with a clear message.
        threat_signal: A user-visible error other than the identify network error, or a blank UI, when offline.
      sha256: 6213c5db41f87adbfadcb7fca84caa7d4f1ea37b122cec32ecb243da498e0d86
    inv_outbound_link_hygiene:
      parent: invariants
      props:
        category: security
        done: true
        statement: Every outbound retailer link carries rel="noopener sponsored" and target="_blank".
        threat_signal: A rendered .buy link missing either attribute.
      sha256: 66b6deb8c921bf06965bd6af105ddeb87b369a6691da96022f716c2960287971
    inv_photo_never_persists_server:
      parent: invariants
      props:
        category: privacy
        done: true
        statement: >-
          The captured photo is never stored on any server. It is transmitted once to the identify endpoint per user
          request, then forgotten.
        threat_signal: An identify request logs, echoes, or persists the image bytes.
      sha256: 29e452e9b20ec5c8ce80fc9dde185cc344801f8d5fde83203dd829197a7c6746
    inv_public_api_scope:
      parent: invariants
      props:
        category: security
        done: true
        statement: /api/fastenaiting/* is the only public API path; every other /api route requires Cloudflare Access.
        threat_signal: A 200 from any non-fastenaiting /api endpoint with no Cf-Access-Jwt-Assertion header.
      sha256: 173b38fa2c9d3dc2256cbeb3c867e1c58a297bee78b78b608f9e813a2b52af7d
    inv_pwa_installable:
      parent: invariants
      props:
        category: platform
        done: true
        statement: >-
          The manifest, HTTPS, icons, and service worker jointly satisfy the browser's installability criteria whenever
          the app is served over its production origin.
        threat_signal: Lighthouse PWA installability audit failing on a production URL.
      sha256: 4391e1fcb54545a0762f7cc0fccb57688d5eca109efb91a403db82534f6a83c9
    inv_sw_cache_versioned:
      parent: invariants
      props:
        category: availability
        done: true
        statement: The service worker cache name embeds a version tag; activation purges every prior version.
        threat_signal: caches.keys() contains more than one fastenaiting-* cache after activate.
      sha256: 7a87bb80674cdbfa7c4d505ad68a45db93754015576fd0bceb8cf01cd4331e13
    inv_sw_never_caches_identify:
      parent: invariants
      props:
        category: availability
        done: true
        statement: The service worker never serves /api/fastenaiting/identify from cache and never stores its responses.
        threat_signal: >-
          An identify response served with a `from-service-worker` marker, or a cache entry matching
          /api/fastenaiting/*.
      sha256: af7c40dc2124c91c45bfbf6aa0a0d53f08d1ae58c97ab536c5f2a46848dcf118
    inv_tap_target_size:
      parent: invariants
      props:
        category: accessibility
        done: true
        statement: Every interactive control has a hit area of at least 44 × 44 CSS pixels.
        threat_signal: A pointer target measured below 44 px in either dimension.
      sha256: 9721aee67def45ab931fbc8a422a07033a3b2e2f14747f16e642e0b6dc957c9d
  constraint:
    con_affiliate_tags_client_only:
      parent: constraints
      props:
        domain: privacy
        rationale: >-
          The tags belong to the person visiting; storing them server-side would be a data-protection liability and an
          operational burden.
        text: Affiliate tags are stored in localStorage only and read at link-render time.
      sha256: 6b6a8a4d5419bbc6d7f4d4d9af3ea335c36237907ed2b752e8fb46bea7aeee96
    con_ai_via_pages_function:
      parent: constraints
      props:
        domain: security
        rationale: >-
          Anthropic's API does not permit browser CORS by default, and shipping keys client-side is unsafe. BYOK still
          routes through the function via x-user-api-key so a single code path handles both modes.
        text: >-
          All Anthropic calls originate from the Pages Function at /api/fastenaiting/identify. The browser never calls
          Anthropic directly.
      sha256: 0975b92daf397bc9d3bfb7d944c36c848284500d7b92aee6bb1b5c5faf65f978
    con_buy_search_urls:
      parent: constraints
      props:
        domain: compliance
        rationale: Search URLs are always allowed. Deep product URLs would break as SKUs rotate and could violate ToS.
        text: >-
          Buy links are search URLs built by affiliate.js from spec fields. No retailer scraping, no server-side product
          lookup.
      sha256: 054903df33f56aaa0f254a07c85fa27e47a0ea4c1b1d29462c19418c41c18ee2
    con_camera_facing_environment:
      parent: constraints
      props:
        domain: ux
        rationale: >-
          On phones the rear camera is almost always what the user wants for a fastener photo. Requesting the ideal
          facing avoids a device chooser prompt.
        text: >-
          getUserMedia is called with facingMode { ideal: "environment" } on first use; the flip button toggles to
          "user". Enumeration of devices happens after permission grant.
      sha256: 80b393e0528abac2b0b75ba62fa47e6120094b67531c9bd60847ae71cfbd77dc
    con_field_whitelist_on_apply:
      parent: constraints
      props:
        domain: security
        rationale: >-
          A hostile or hallucinated response cannot inject unexpected DOM attributes or trigger unexpected downstream
          behavior.
        text: >-
          applySpec iterates the form's own inputs by name and only writes fields that exist on the form. Unknown keys
          are dropped.
      sha256: 668db0211fc7689261500f55b508194d8f9369f9e6913b0f66fe88f589605b0d
    con_haptic_snap_optional:
      parent: constraints
      props:
        domain: ux
        rationale: >-
          A missing haptic is invisible on non-Android devices. Faking it (audio, visual flash) would be worse than
          nothing.
        text: navigator.vibrate(20) fires on snap only if the API exists. No polyfill, no fallback UI.
      sha256: 960be1ee67d2a6d1c52ab8125b1b9a814b9d1370fdb43b87d93fbbe3bf2a3a08
    con_json_only_prompt:
      parent: constraints
      props:
        domain: data_design
        rationale: >-
          Free-form model output would force fragile client-side parsing. Rejecting non-JSON at the boundary keeps the
          client trust surface small.
        text: >-
          The system prompt to the vision model requires a single JSON object with the whitelisted keys, no prose, no
          code fences. The server strips fences defensively and rejects non-parsing responses.
      sha256: 063b80425226dd2aa4bd83ce5a1c3721f1a42ffd80029a8d702121c5e5ef1075
    con_label_360dpi_canvas:
      parent: constraints
      props:
        domain: export_fidelity
        rationale: >-
          360dpi matches high-end P-touch printer resolution. Brother's own software rescales any image to tape, so a
          slightly-too-high resolution is safer than too low.
        text: >-
          The label is drawn on an HTMLCanvasElement sized to 12mm × selected-length at 360dpi, downloaded via
          toDataURL("image/png").
      sha256: 01171ed02360efe53715d109403a69bec65047ac2d46c3e15632eaf471ad3e6d
    con_manual_always_available:
      parent: constraints
      props:
        domain: ux
        rationale: >-
          The AI is a shortcut, not a gate. Offline, over-budget, or misidentified fasteners must not block the
          deliverable.
        text: >-
          Every AI-invoking path also has a fully manual equivalent that produces the same downstream artefacts (label,
          buy links).
      sha256: 0336f9810656c787fe35c2671b4abc7dcb77bc3300a8b432cd6682a4407654ea
    con_mobile_first_layout:
      parent: constraints
      props:
        domain: ux
        rationale: >-
          The primary use is one-handed in a hardware store. Mobile-first eliminates the retrofit tax and avoids iOS
          zoom traps.
        text: >-
          CSS base styles target mobile; media queries at 520/640/720/760px progressively enhance. All inputs are 16px+,
          tap targets 44px+, layout uses env(safe-area-inset-*).
      sha256: 7a26f74bbbcb9eac0cce8c001abd94c265ad097f39143d60eb22c971661018f3
    con_no_bantay_signin_dependency:
      parent: constraints
      props:
        domain: security
        rationale: >-
          The tool must work at fastenaiting.com without any Bantay account. Any coupling would tie a public product to
          a private auth system.
        text: Nothing in fastenAIting reads or writes Bantay Tools' D1 database or requires signin.
      sha256: d940db28b468ecf36e21a33ee7a3ae09785dd904b1cfedca695722f2713e2fb6
    con_parametric_isometric_svg:
      parent: constraints
      props:
        domain: data_design
        rationale: >-
          Every new head/drive combination would otherwise require a hand-drawn asset. Parametric drawing scales to
          combinations we haven't foreseen.
        text: >-
          Isometric drawings are generated as SVG strings by fasteners.js from spec fields; no bitmap asset library is
          checked in.
      sha256: 1eaaca731c68a0c98c3faa1dc6341b2acf1abef145c61fa8dcc460808ab0cfd1
    con_public_middleware_whitelist:
      parent: constraints
      props:
        domain: security
        rationale: >-
          Adding a per-route auth bypass is error-prone. A single list at the middleware boundary is auditable and
          reviewable in one place.
        text: >-
          /api/fastenaiting/* is opted out of Cloudflare Access via a PUBLIC_PREFIXES list in
          functions/api/_middleware.js.
      sha256: 5008a837316f8f3ca5e3bed324980d795323dbcdc53a58d774d71f70c4f8449a
    con_pwa_scope:
      parent: constraints
      props:
        domain: security
        rationale: >-
          Other tools on tools.bantay.co must not be affected by this SW; a stray scope would silently cache foreign
          HTML.
        text: >-
          The manifest scope and service worker registration scope are both exactly /fastenaiting/. The SW never handles
          requests outside this scope other than /_shared/.
      sha256: 60870d7b2d1da969b1d50cd6f82510bab51ee6075fe84e0198f84455f9f597de
    con_root_domain_redirect:
      parent: constraints
      props:
        domain: platform
        rationale: >-
          The domain sits on the shared Pages project. A 302 keeps the tool at its canonical path without breaking
          relative URLs.
        text: _redirects sends https://fastenaiting.com/ and https://www.fastenaiting.com/ to /fastenaiting/ with a 302.
      sha256: 86cf2e0b87c41d671299f24767caf30f9fb29e5ec780d7d75f1abd0ff2296c2a
    con_shutter_start_and_snap:
      parent: constraints
      props:
        domain: ux
        rationale: >-
          One thumb-reachable primary control is easier to teach than a start/snap toggle. Also reduces layout on small
          screens.
        text: >-
          The single circular shutter button starts the camera on first press when no stream exists, and snaps a frame
          on every press thereafter.
      sha256: 4698825008128de5a73814d41e6d18033f0a9602e84b42c6539846b02d02d64d
    con_sw_shell_cache_first:
      parent: constraints
      props:
        domain: performance
        rationale: >-
          The shell rarely changes; the identify call is per-photo and offline-nonsensical. Two strategies keep code
          simple and correctness obvious.
        text: >-
          The service worker is cache-first for the app shell + shared tokens, network-only for /api/fastenaiting/*, and
          falls back to a 503 when both fail.
      sha256: fe0ab7582ebc0454817df14b1c66279884f5763b2551e33747bc05478245ac00
    con_sw_versioned_cache_name:
      parent: constraints
      props:
        domain: performance
        rationale: A single mutable cache is impossible to invalidate atomically. A version bump is the clearest deploy signal.
        text: >-
          The cache name embeds a version constant (fastenaiting-v1-shell); activate() deletes any cache whose name
          starts with the prefix and doesn't match the current version.
      sha256: d323e3c945981fa356b5e3615af89a50f740bf53377312976a860dc08bb331bf
  foundation:
    f_deliverable_is_the_label:
      parent: foundations
      props:
        text: The label is the deliverable, not the identification. Everything else is scaffolding to make the label right.
      sha256: e22b1881a2dd6b7707a956c1ae57321289a4ee6c566a86582b1f82f2facd8354
    f_manual_override_always:
      parent: foundations
      props:
        text: AI is a shortcut. Every field it fills is editable, every step it takes is skippable.
      sha256: 4ae6719305bf2d565809768704444ba2b3da0e08eddc1af8e2252efd8ce27986
    f_photo_stays_local:
      parent: foundations
      props:
        text: The user's photo is not our asset. It leaves the device only to be identified, once, and is never persisted.
      sha256: 07a70afc7969c7811c0aa1d3954892da6e40e10925c735b76b871aa4d97b90bc
    f_static_first:
      parent: foundations
      props:
        text: The tool ships as a static site plus one Pages Function. No build step, no framework, no client-side router.
      sha256: 5892ac48e34e4b34aab9cf7f40d72440f9eb63b35f7032183ab746d0c7fd0e4a
    f_thumb_reach:
      parent: foundations
      props:
        text: On phones, the "next thing to do" is always one thumb away.
      sha256: 08fe87792ede23479d55172a6fd171a73fea1228265675ce9db0db78eda345fe
  wisdom:
    w_12mm_legibility:
      parent: wisdom
      props:
        text: >-
          At 12mm tape height, sub-line text under ~14px stops being readable. Use size + type + finish as the visible
          hierarchy; move minor detail into filename or PDF.
      sha256: ce3e44f077f96f9a69b79aa477936d96271756fd7c08c436328260b458d30f7c
    w_anthropic_no_cors:
      parent: wisdom
      props:
        text: >-
          Anthropic's API rejects browser CORS by default. Always route through a server-side function; don't try to
          fetch from the client.
      sha256: 81dd767125468f2c999e43df80800dffceaa9abd09ff2f7ab2eb684c498a023a
    w_brother_scales_anything:
      parent: wisdom
      props:
        text: >-
          Brother P-touch software rescales any image to tape; matching aspect ratio matters more than exact pixel
          count. Do not micro-optimize the PNG width.
      sha256: 46f22dd00d6869a3b2cc2d7750b92eaed040fdb5c83b135162ec6fd1a9184e1a
    w_camera_indicator:
      parent: wisdom
      props:
        text: >-
          The OS camera indicator is the user's trust signal. If it stays on after they think they're done, they will
          not come back. Test with pagehide, visibilitychange, and tab reload.
      sha256: ccf777d919a357f81d53a0afa9d40b4776817d4abac5367885652b2b5715ff12
    w_face_the_light:
      parent: wisdom
      props:
        text: >-
          Identification quality collapses when the fastener is backlit against a white surface. The tagline copy —
          'fill the frame, add a coin or ruler' — is doing more work than any prompt tweak.
      sha256: 61a99e48d80cef9b1bfe398b71414fe3f4d348ab75da7e78cce51b6ab176d537
    w_gauge_to_mm_approx:
      parent: wisdom
      props:
        text: >-
          US screw gauges convert to metric roughly as diameter_mm ≈ 1.524 + gauge × 0.815. Good enough for scaling the
          isometric; wrong to use for engineering.
      sha256: 8401ccd53c9e38417ccf11df0a644d38f848c033cde50c2c440481f40b038524
    w_heic_free:
      parent: wisdom
      props:
        text: >-
          HEIC support is free via <input type=file accept='image/*'>. Browsers hand back decoded RGB via FileReader; do
          not add a HEIC library.
      sha256: 454d6289fb8104721631db5051000df2b310061a6d9e3f904c6a9d370d16d96c
    w_ios_no_beforeinstallprompt:
      parent: wisdom
      props:
        text: >-
          iOS Safari never fires beforeinstallprompt. Detect standalone via matchMedia('(display-mode: standalone)') and
          coach the user to Share > Add to Home Screen.
      sha256: b181f581b41c67ebe27d387ad470296bec9455641f5fa4b410e57136d7f4999a
    w_retailer_affiliate_deep_links:
      parent: wisdom
      props:
        text: >-
          Home Depot and Lowe's have no clean affiliate URL format. Store opaque partner tokens today; upgrade to
          CJ/Impact deep-link tools later without touching schema.
      sha256: ef0b121134ce9c3facef70bd7fe82fb48d6c2f0d063bb6e3f44c34bd75d28b2c
