  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Screw head (top view) -->
  <circle cx="256" cy="256" r="170" fill="url(#metal)" stroke="#5b6067" stroke-width="4"/>
  <!-- Phillips cross recess -->
  <g fill="#1e293b">
    <rect x="238" y="120" width="36" height="272" rx="8"/>
    <rect x="120" y="238" width="272" height="36" rx="8"/>
