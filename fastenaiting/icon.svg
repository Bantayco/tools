      <stop offset="0" stop-color="#14a09a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </radialGradient>
    <radialGradient id="metal" cx="0.35" cy="0.30" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d8dbde"/>
      <stop offset="1" stop-color="#8b9096"/>
